<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Project Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f0;
      --fg: #0a0a0a;
      --muted: #888;
      --accent: #c2b280;
      --border: rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 3rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem; font-weight: 500; letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--fg); color: #fff;
      border: none; border-radius: 4px;
      font-family: inherit; font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: all 0.3s;
    }
    .btn:hover { background: #333; transform: translateY(-1px); }
    .btn.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .btn.secondary:hover { background: rgba(0,0,0,0.05); }
    .btn.danger { background: #c0392b; }
    .btn.danger:hover { background: #a93226; }
    .btn.success { background: #27ae60; }
    .btn.small { padding: 0.5rem 1rem; font-size: 0.8125rem; }

    .grid {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 3rem;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Form */
    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      position: sticky; top: 2rem;
      height: fit-content;
    }

    .panel h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem; font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block; font-size: 0.8125rem; font-weight: 500;
      margin-bottom: 0.5rem; color: var(--fg);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg);
      font-family: inherit; font-size: 0.9375rem;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none; border-color: var(--fg);
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .image-inputs { display: flex; flex-direction: column; gap: 0.5rem; }
    .image-row {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .image-row input { flex: 1; }
    .image-row button {
      padding: 0.5rem 0.75rem;
      background: transparent; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer; font-size: 0.8125rem;
    }
    .image-row button:hover { background: rgba(0,0,0,0.05); }

    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 0.75rem;
    }
    .file-drop:hover, .file-drop.dragover {
      border-color: var(--fg);
      background: rgba(0,0,0,0.02);
    }

    .form-actions {
      display: flex; gap: 0.75rem; margin-top: 1.5rem;
    }

    /* Project List */
    .list-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .list-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem; font-weight: 500;
    }

    .project-list { display: flex; flex-direction: column; gap: 1rem; }

    .project-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex; gap: 1rem;
      align-items: flex-start;
      transition: all 0.3s;
    }
    .project-item:hover {
      border-color: rgba(0,0,0,0.2);
      transform: translateX(4px);
    }

    .project-thumb {
      width: 80px; height: 60px;
      border-radius: 4px; object-fit: cover;
      background: var(--bg); flex-shrink: 0;
    }

    .project-info { flex: 1; }
    .project-info h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem; font-weight: 500; margin-bottom: 0.25rem;
    }
    .project-info p {
      font-size: 0.8125rem; color: var(--muted);
      line-height: 1.4;
    }

    .project-actions {
      display: flex; gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .project-item:hover .project-actions { opacity: 1; }

    /* Preview Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,10,0.9);
      z-index: 100;
      display: none; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .overlay.active { display: flex; }
    .overlay-content {
      background: var(--bg);
      max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: 8px; padding: 2rem;
    }
    .overlay-close {
      position: absolute; top: 1.5rem; right: 1.5rem;
      background: none; border: none; color: #fff;
      font-size: 2rem; cursor: pointer;
    }

    /* Export area */
    .export-area {
      margin-top: 3rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
    }
    .export-area h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem; font-weight: 500;
      margin-bottom: 1rem;
    }
    .code-block {
      background: #0a0a0a; color: #f5f5f0;
      padding: 1.5rem;
      border-radius: 6px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.8125rem;
      line-height: 1.6;
      overflow-x: auto;
      max-height: 300px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
    }

    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state svg {
      width: 48px; height: 48px; margin-bottom: 1rem;
      opacity: 0.3;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
      font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Atelier — Project Manager</h1>
      <div style="display:flex;gap:0.75rem;">
        <button class="btn secondary" onclick="importJSON()">Import JSON</button>
        <button class="btn" onclick="exportJSON()">Export JSON</button>
        <button class="btn success" onclick="generateCode()">Generate Portfolio Code</button>
      </div>
    </header>

    <div class="grid">
      <!-- Form Panel -->
      <div class="panel">
        <h2 id="form-title">Add New Project</h2>
        <form id="project-form" onsubmit="handleSubmit(event)">
          <input type="hidden" id="edit-id" value="">

          <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="title" required placeholder="e.g. Villa Korsør">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select id="category">
                <option>Residential</option>
                <option>Commercial</option>
                <option>Cultural</option>
                <option>Hospitality</option>
                <option>Public</option>
                <option>Industrial</option>
                <option>Masterplan</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year</label>
              <input type="number" id="year" required min="2000" max="2030" value="2024">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="location" required placeholder="e.g. Copenhagen, Denmark">
            </div>
            <div class="form-group">
              <label>Area</label>
              <input type="text" id="area" placeholder="e.g. 340 m²">
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="description" required placeholder="Describe the project concept, materials, and design approach..."></textarea>
          </div>

          <div class="form-group">
            <label>Cover Image</label>
            <div class="file-drop" id="cover-drop" onclick="document.getElementById('cover-file').click()">
              Drop image here or click to upload<br>
              <small>Or paste an image URL below</small>
            </div>
            <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="handleFile(this, 'cover')">
            <input type="text" id="cover-url" placeholder="https://..." onchange="updatePreview('cover', this.value)">
            <img id="cover-preview" style="width:100%;margin-top:0.5rem;border-radius:4px;display:none;max-height:200px;object-fit:cover;">
          </div>

          <div class="form-group">
            <label>Gallery Images</label>
            <div class="image-inputs" id="gallery-inputs">
              <div class="image-row">
                <input type="text" placeholder="Image URL..." class="gallery-url">
                <button type="button" onclick="this.parentElement.remove()">×</button>
              </div>
            </div>
            <button type="button" class="btn secondary small" onclick="addGalleryRow()" style="margin-top:0.5rem;">+ Add Image</button>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn" id="submit-btn">Add Project</button>
            <button type="button" class="btn secondary" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>

      <!-- List Panel -->
      <div>
        <div class="list-header">
          <h2>Projects <span class="badge" id="count-badge">0</span></h2>
          <button class="btn danger small" onclick="clearAll()" id="clear-btn" style="display:none;">Clear All</button>
        </div>
        <div class="project-list" id="project-list">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M9 21V9"/>
            </svg>
            <p>No projects yet. Add your first project using the form.</p>
          </div>
        </div>

        <div class="export-area" id="export-area" style="display:none;">
          <h2>Generated Code</h2>
          <p style="font-size:0.875rem;color:var(--muted);margin-bottom:1rem;">
            Copy this array and replace the <code>PROJECTS</code> array in your <code>portfolio.html</code> file.
          </p>
          <div class="code-block" id="code-output"></div>
          <button class="btn secondary small" onclick="copyCode()" style="margin-top:1rem;">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================
    // STATE
    // ============================
    let projects = JSON.parse(localStorage.getItem('atelier_projects') || '[]');
    let coverImage = '';

    // ============================
    // INIT
    // ============================
    renderList();

    // ============================
    // FILE HANDLING
    // ============================
    function handleFile(input, type) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (type === 'cover') {
          coverImage = e.target.result;
          document.getElementById('cover-preview').src = coverImage;
          document.getElementById('cover-preview').style.display = 'block';
          document.getElementById('cover-url').value = coverImage;
        }
      };
      reader.readAsDataURL(file);
    }

    // Drag & drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      document.getElementById('cover-drop').addEventListener(eventName, (e) => {
        e.preventDefault(); e.stopPropagation();
      });
    });
    document.getElementById('cover-drop').addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('cover-file').files = dt.files;
        handleFile(document.getElementById('cover-file'), 'cover');
      }
    });

    function updatePreview(type, url) {
      if (type === 'cover' && url) {
        coverImage = url;
        document.getElementById('cover-preview').src = url;
        document.getElementById('cover-preview').style.display = 'block';
      }
    }

    function addGalleryRow(url = '') {
      const div = document.createElement('div');
      div.className = 'image-row';
      div.innerHTML = `
        <input type="text" placeholder="Image URL..." class="gallery-url" value="${url}">
        <button type="button" onclick="this.parentElement.remove()">×</button>
      `;
      document.getElementById('gallery-inputs').appendChild(div);
    }

    // ============================
    // FORM HANDLING
    // ============================
    function handleSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;

      const galleryUrls = Array.from(document.querySelectorAll('.gallery-url'))
        .map(i => i.value.trim()).filter(Boolean);
      const coverUrl = document.getElementById('cover-url').value.trim() || coverImage;

      if (!coverUrl) { alert('Please provide a cover image'); return; }

      const project = {
        id: editId ? parseInt(editId) : Date.now(),
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value,
        year: document.getElementById('year').value,
        location: document.getElementById('location').value.trim(),
        area: document.getElementById('area').value.trim(),
        description: document.getElementById('description').value.trim(),
        cover: coverUrl,
        images: [coverUrl, ...galleryUrls]
      };

      if (editId) {
        const idx = projects.findIndex(p => p.id === parseInt(editId));
        if (idx > -1) projects[idx] = project;
      } else {
        projects.push(project);
      }

      save();
      resetForm();
      renderList();
    }

    function resetForm() {
      document.getElementById('project-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('form-title').textContent = 'Add New Project';
      document.getElementById('submit-btn').textContent = 'Add Project';
      coverImage = '';
      document.getElementById('cover-preview').style.display = 'none';
      document.getElementById('gallery-inputs').innerHTML = `
        <div class="image-row">
          <input type="text" placeholder="Image URL..." class="gallery-url">
          <button type="button" onclick="this.parentElement.remove()">×</button>
        </div>
      `;
    }

    function editProject(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;

      document.getElementById('edit-id').value = p.id;
      document.getElementById('title').value = p.title;
      document.getElementById('category').value = p.category;
      document.getElementById('year').value = p.year;
      document.getElementById('location').value = p.location;
      document.getElementById('area').value = p.area;
      document.getElementById('description').value = p.description;
      document.getElementById('cover-url').value = p.cover;
      coverImage = p.cover;
      document.getElementById('cover-preview').src = p.cover;
      document.getElementById('cover-preview').style.display = 'block';

      document.getElementById('gallery-inputs').innerHTML = '';
      const extraImages = p.images.slice(1);
      if (extraImages.length === 0) addGalleryRow();
      else extraImages.forEach(url => addGalleryRow(url));

      document.getElementById('form-title').textContent = 'Edit Project';
      document.getElementById('submit-btn').textContent = 'Update Project';
      document.querySelector('.panel').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteProject(id) {
      if (!confirm('Delete this project?')) return;
      projects = projects.filter(p => p.id !== id);
      save();
      renderList();
    }

    function clearAll() {
      if (!confirm('Delete ALL projects? This cannot be undone.')) return;
      projects = [];
      save();
      renderList();
    }

    // ============================
    // RENDER
    // ============================
    function renderList() {
      const list = document.getElementById('project-list');
      const count = document.getElementById('count-badge');
      const clearBtn = document.getElementById('clear-btn');

      count.textContent = projects.length;
      clearBtn.style.display = projects.length > 0 ? 'inline-flex' : 'none';

      if (projects.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M9 21V9"/>
            </svg>
            <p>No projects yet. Add your first project using the form.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = projects.map(p => `
        <div class="project-item">
          <img src="${p.cover}" class="project-thumb" alt="${p.title}">
          <div class="project-info">
            <h3>${p.title}</h3>
            <p>${p.category} — ${p.year} — ${p.location}</p>
          </div>
          <div class="project-actions">
            <button class="btn secondary small" onclick="editProject(${p.id})">Edit</button>
            <button class="btn danger small" onclick="deleteProject(${p.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function save() {
      localStorage.setItem('atelier_projects', JSON.stringify(projects));
    }

    // ============================
    // IMPORT / EXPORT
    // ============================
    function exportJSON() {
      const dataStr = JSON.stringify(projects, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `atelier-projects-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data)) {
              projects = data;
              save();
              renderList();
              alert(`Imported ${data.length} projects`);
            }
          } catch (err) {
            alert('Invalid JSON file');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ============================
    // GENERATE CODE
    // ============================
    function generateCode() {
      const code = 'const PROJECTS = ' + JSON.stringify(projects, null, 2) + ';';
      document.getElementById('code-output').textContent = code;
      document.getElementById('export-area').style.display = 'block';
      document.getElementById('export-area').scrollIntoView({ behavior: 'smooth' });
    }

    function copyCode() {
      const text = document.getElementById('code-output').textContent;
      navigator.clipboard.writeText(text).then(() => alert('Copied!'));
    }
  </script>
</body>
</html>
